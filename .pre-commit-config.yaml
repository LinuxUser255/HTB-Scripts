# Pre-commit hooks for the HTB-Scripts repo.
#
# Every code-quality hook is scoped to the burp_anon package with
# `files: ^Utils/burp_anon/`, so the rest of the repo is intentionally left
# alone. Tool settings live in Utils/burp_anon/pyproject.toml.
#
# One-time setup:
#     pip install -r Utils/burp_anon/requirements-dev.txt
#     pre-commit install
# Run against everything on demand:
#     pre-commit run --all-files
minimum_pre_commit_version: "4.0.0"
default_language_version:
  python: python3

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        files: ^Utils/burp_anon/
      - id: end-of-file-fixer
        files: ^Utils/burp_anon/
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files

  - repo: https://github.com/psf/black
    rev: 26.10.1
    hooks:
      - id: black
        files: ^Utils/burp_anon/
        args: ["--line-length=99"]

  - repo: https://github.com/pycqa/isort
    rev: 9.0.2
    hooks:
      - id: isort
        files: ^Utils/burp_anon/
        args: ["--settings-path=Utils/burp_anon/pyproject.toml"]

  - repo: https://github.com/pycqa/flake8
    rev: 7.4.1
    hooks:
      - id: flake8
        files: ^Utils/burp_anon/
        exclude: ^Utils/burp_anon/tests/
        # E203/W503: defer to Black. E501: Black owns line length and leaves
        # only unsplittable long lines (string/data literals), so don't double-flag.
        args: ["--max-line-length=99", "--extend-ignore=E203,E501,W503"]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.0
    hooks:
      - id: mypy
        files: ^Utils/burp_anon/
        args: ["--config-file=Utils/burp_anon/pyproject.toml"]

  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        files: ^Utils/burp_anon/
        args: ["-c", "Utils/burp_anon/pyproject.toml"]
        additional_dependencies: ["bandit[toml]"]
